<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMate - Tambah Tugas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-white">
            <div class="container">
                <a class="navbar-brand" href="index.html">TaskMate</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Daftar Tugas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="tambah-tugas.html">Tambah Tugas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="detail-tugas.html">Detail Tugas</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <article class="card p-4">
                    <h1>Tambah Tugas Baru</h1>
                    <p class="text-muted">Masukkan data tugas kuliah yang ingin dicatat.</p>

                    <!-- Alert Validasi jQuery -->
                    <div id="alert-error" class="alert alert-danger" style="display: none;" role="alert">
                        Mohon lengkapi seluruh field formulir sebelum menyimpan.
                    </div>
                    <div id="alert-sukses" class="alert alert-success" style="display: none;" role="alert">
                        Data tugas berhasil disimpan! <a href="index.html" class="alert-link">Lihat di Daftar Tugas</a>
                    </div>

                    <form id="form-tambah-tugas" action="#" method="post" novalidate>
                        <div class="mb-3">
                            <label for="mata-kuliah" class="form-label">Mata Kuliah</label>
                            <input type="text" class="form-control" id="mata-kuliah" name="mata_kuliah" placeholder="Contoh: Web Programming">
                        </div>

                        <div class="mb-3">
                            <label for="judul-tugas" class="form-label">Judul Tugas</label>
                            <input type="text" class="form-control" id="judul-tugas" name="judul_tugas" placeholder="Contoh: Tugas 3 CSS">
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="deadline" class="form-label">Deadline</label>
                                <input type="date" class="form-control" id="deadline" name="deadline">
                            </div>

                            <div class="col-md-4 mb-3">
                                <label for="prioritas" class="form-label">Prioritas</label>
                                <select class="form-select" id="prioritas" name="prioritas">
                                    <option value="">Pilih prioritas</option>
                                    <option value="rendah">Rendah</option>
                                    <option value="sedang">Sedang</option>
                                    <option value="tinggi">Tinggi</option>
                                </select>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label for="status" class="form-label">Status</label>
                                <select class="form-select" id="status" name="status">
                                    <option value="">Pilih status</option>
                                    <option value="belum">Belum Dimulai</option>
                                    <option value="proses">Sedang Dikerjakan</option>
                                    <option value="selesai">Selesai</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="deskripsi" class="form-label">Deskripsi / Catatan</label>
                            <textarea class="form-control" id="deskripsi" name="deskripsi" rows="4" placeholder="Catatan atau instruksi tugas..."></textarea>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Simpan</button>
                            <button type="reset" class="btn btn-secondary">Reset</button>
                            <a href="index.html" class="btn btn-link ms-auto">Batal</a>
                        </div>
                    </form>
                </article>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 TaskMate - Mikdam Huda (1302223034)</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
